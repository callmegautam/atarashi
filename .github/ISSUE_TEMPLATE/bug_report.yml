name: Bug report
description: Something Atarashi did that it should not have
labels: [bug, needs-triage]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: Include the exact command you ran and the full output.
    validations: { required: true }
  - type: textarea
    id: expected
    attributes:
      label: What you expected instead
    validations: { required: true }
  - type: input
    id: version
    attributes:
      label: Atarashi version
      placeholder: "1.0.0 (atarashi --version)"
    validations: { required: true }
  - type: input
    id: node
    attributes:
      label: Node version and OS
      placeholder: "Node 20.11 on macOS 15"
    validations: { required: true }
  - type: textarea
    id: doctor
    attributes:
      label: "`atarashi doctor` output"
      render: shell
