name: CI

on:
  push:
    branches: [main, v1]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Keep every job's blueprint cache in one restorable place.
  ATARASHI_CACHE_DIR: ${{ github.workspace }}/.cache/atarashi

jobs:
  # Everything that only needs to be true once. Mirrors the first gates of
  # `pnpm release:check`, in the same order, so a red job here names the same
  # command a maintainer would run locally.
  check:
    name: typecheck, lint, build, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20.11
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm build
      - run: pnpm test
      - name: security boundary tests
        run: pnpm check:security
      - name: blueprint conformance
        run: pnpm validate:blueprints
      - name: generated docs are current
        run: pnpm check:docs
      - name: packaging (publint, are-the-types-wrong, size budget)
        run: pnpm check:packaging

  # The unit suites on the platforms a maintainer does not have. Windows is
  # what finds path separator and line ending bugs.
  matrix:
    name: test (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ['20.11', '22', '24']
        exclude:
          # Covered in full by the `check` job above.
          - os: ubuntu-latest
            node: '20.11'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test

  # Generate, install, build, lint, test and boot a real project. Slow, and the
  # only gate that catches a blueprint that renders but does not run.
  e2e:
    name: e2e matrix
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20.11
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm e2e
      - name: cold-start benchmark
        run: pnpm bench
